[project]
name = "spec-board"
version = "0.1.0"
description = "사람과 AI가 같은 그래프 작업을 보고 결정·확인에 답하는 로컬 보드"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dong-park" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
spec-board = "spec_board.cli:main"

[project.urls]
Homepage = "https://github.com/dong-park/spec-board"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec_board"]
exclude = ["**/__pycache__", "**/*.test.mjs", "**/*.browser.mjs", "**/*.fixture.mjs"]
